<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>feuersteiner — README header</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; color: #1f2328; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
    .header { display: grid; grid-template-columns: 360px 1fr; align-items: center; gap: 32px; max-width: 960px; margin: auto; }
    .scene { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: #fff4dc; isolation: isolate; }
    .scene img { position: absolute; height: auto; image-rendering: pixelated; }
    /* Back to front: workspace, bicycle, greeting. Positions share a 640px square. */
    .desk { z-index: 1; width: 70.3125%; left: 27.1875%; top: 27.65625%; }
    .bike { z-index: 2; width: 62.5%; left: 35.625%; top: 58.59375%; }
    .avatar { z-index: 3; width: 65.625%; left: -14.84375%; top: -1.5625%; }
    h1 { margin: 0 0 16px; font-size: 32px; }
    p { margin: 0 0 16px; }
    a { color: #0969da; }
    @media (max-width: 680px) {
      body { padding: 20px; }
      .header { grid-template-columns: 1fr; gap: 24px; }
      .scene { max-width: 360px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="scene" role="img" aria-label="Pixel-art avatar waving hello, with a red road bike and a desk with two screens behind him">
      <img class="desk" src="header-desk.png" alt="">
      <img class="bike" src="header-bike.png" alt="">
      <img class="avatar" src="header-standing-wave.png" alt="">
    </div>
    <div>
      <h1>feuersteiner</h1>
      <p>We build software with AI. We work across business, product, design, and engineering.</p>
      <p><a href="https://flintworks.dev">Writing &amp; experiments ↗</a></p>
    </div>
  </header>
</body>
</html>

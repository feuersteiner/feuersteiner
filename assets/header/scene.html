<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>feuersteiner — README header</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; color: #1f2328; font: 16px/1.5 system-ui, sans-serif; }
    /* A/D/X: foreground avatar. B/C/E/F: introduction. X/Y: desk. Z: bike. */
    .header { position: relative; isolation: isolate; display: flex; width: 100%; max-width: 960px; aspect-ratio: 16 / 9; margin: auto; }
    .avatar-column { position: relative; z-index: 1; display: flex; flex: 0 0 33.333333%; align-items: center; justify-content: center; overflow: hidden; }
    .avatar { height: 100%; width: auto; image-rendering: pixelated; }
    .right-column { display: flex; flex: 1; min-width: 0; flex-direction: column; }
    .intro { display: flex; flex: 0 0 66.666667%; flex-direction: column; justify-content: center; gap: 24px; padding: 24px; }
    .objects { position: absolute; inset: auto 0 0; height: 33.333333%; display: flex; }
    .object { display: flex; flex: 1; min-width: 0; align-items: flex-end; justify-content: center; padding: 0 12px 16px; }
    .desk { flex: 0 0 66.666667%; }
    .object img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; image-rendering: pixelated; }
    h1 { margin: 0; font-size: clamp(20px, 4vw, 44px); }
    p { margin: 0; font-size: clamp(12px, 2.2vw, 24px); }
    .link { max-width: 960px; margin: 16px auto 0; font-size: 16px; }
    a { color: #0969da; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; }
      a { color: #58a6ff; }
    }
    @media (max-width: 680px) {
      body { padding: 20px; }
      .intro { padding: 12px; gap: 12px; }
      .object { padding: 0 4px 8px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="avatar-column">
      <img class="avatar" src="header-standing-wave.png" alt="Pixel-art avatar standing and waving hello">
    </div>
    <div class="right-column">
      <div class="intro">
        <h1>feuersteiner</h1>
        <p>We build software with AI. We work across business, product, design, and engineering.</p>
      </div>
    </div>
    <div class="objects">
      <div class="object desk"><img src="header-desk.png" alt="Desk with two screens"></div>
      <div class="object"><img src="header-bike.png" alt="Red road bike"></div>
    </div>
  </header>
  <p class="link"><a href="https://flintworks.dev">Writing &amp; experiments ↗</a></p>
</body>
</html>
